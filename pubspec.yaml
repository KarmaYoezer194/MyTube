name: mytube
description: "MyTube - a video app demo built with Flutter."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^4.0.3
  cloud_firestore: ^7.1.0
  dio: ^5.11.1
  file_picker: ^13.3.0
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  intl: ^0.20.2
  material_symbols_icons: ^4.2960.0
  shared_preferences: ^2.5.6
  shimmer: ^4.0.0
  video_player: ^2.14.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
